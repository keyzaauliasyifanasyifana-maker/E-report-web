<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - LaporIn!</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-dash">

 <header class="header">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 54 42" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M27 17C21 5 8 2 3 8c-4 5 0 14 8 16 7 1 13-2 16-7Z" fill="#c9619a"/>
        <path d="M27 17c6-12 19-15 24-9 4 5 0 14-8 16-7 1-13-2-16-7Z" fill="#c9619a"/>
        <rect x="22" y="13" width="10" height="10" rx="4" fill="#d9779f"/>
        <path d="M24 24 14 38M30 24l10 14" stroke="#e8a3c3" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Lapor<em>In!</em></span>
      <span class="brand-tag">Pelaporan fasilitas sekolah</span>
    </a>

    <nav class="nav">
      <a href="index.html">Laporkan</a>
      <a href="dashboard.html" class="active">Dashboard <span class="badge">8</span></a>
    </nav>
  </header>

  <main class="dash">
    <h1>Dashboard!</h1>

    <section class="stats">
      <div class="stat total">
        <div class="label">Total Laporan
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></svg>
        </div>
        <div class="num">24</div>
      </div>
      <div class="stat wait">
        <div class="label">Menunggu Proses
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </div>
        <div class="num">08</div>
      </div>
      <div class="stat done">
        <div class="label">Selesai
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
        </div>
        <div class="num">16</div>
      </div>
    </section>

    <section class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" placeholder="Cari laporan…">
      </label>
      <div class="filters">
        <a href="#" class="chip-filter active">Semua <span class="count">24</span></a>
        <a href="#" class="chip-filter">Menunggu <span class="count">8</span></a>
        <a href="#" class="chip-filter">Selesai <span class="count">6</span></a>
      </div>
    </section>

    <section class="list-card">
      <div class="list-head">
        <h2>Daftar Laporan <span>24 laporan</span></h2>
        <p>Klik aksi untuk memperbarui status.</p>
      </div>

      <table>
        <colgroup>
          <col style="width:200px"><col style="width:178px"><col style="width:271px"><col><col style="width:210px">
        </colgroup>
        <thead>
          <tr>
            <th>PELAPOR</th>
            <th>KATEGORI</th>
            <th>DESKRIPSI</th>
            <th>STATUS</th>
            <th>AKSI</th>
          </tr>
        </thead>
        <tbody id="reports-table-body">
          
        </tbody>
      </table>
    </section>
  </main>

 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/app.js"></script>
</body>
</html>
