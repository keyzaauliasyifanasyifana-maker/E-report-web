<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaporIn! - pelaporan fasilitas sekolah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-lapor">

    <header class="header">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 54 42" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M27 17C21 5 8 2 3 8c-4 5 0 14 8 16 7 1 13-2 16-7Z" fill="#c9619a"/>
        <path d="M27 17c6-12 19-15 24-9 4 5 0 14-8 16-7 1-13-2-16-7Z" fill="#c9619a"/>
        <rect x="22" y="13" width="10" height="10" rx="4" fill="#d9779f"/>
        <path d="M24 24 14 38M30 24l10 14" stroke="#e8a3c3" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Lapor<em>In!</em></span>
      <span class="brand-tag">Pelaporan fasilitas sekolah</span>
    </a>

    <nav class="nav">
        <a href="index.html" class="active">Laporkan</a>
        <a href="dashboard.html">Dashboard <span class="badge">8</span></a>
    </nav>
    </header>

    <main class="hero">
        <h1>
            Halowww, Students!<br>
            Ada yang<br>
            <em>rusak</em> <span class="hl">di sekolah?</span><br>
            Laporin yuk!
         </h1>

        <section class="card">
            <h2>Laporin yuk!</h2>

            <form id="facility-report-form" action="#" method="post">
                <div class="field">
                    <label for="Pelapor">Pelapor</label>
                    <input type="text" id="input-reporter" name="reporter" placeholder="Nama lengkap kamu">
                </div>
                
             <div class="field">
            <label for="kategori">Kategori</label>
            <select id="select-category" name="category">
            <option value="" selected disabled>Pilih kategori kerusakan</option>
            <option value="AC">AC</option>
            <option value="Komputer">Komputer</option>
            <option value="Furnitur">Furnitur</option>
            <option value="Kelistrikan">Kelistrikan</option>
            <option value="Sanitasi">Sanitasi</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

                <div class="field">
                    <label for="deskripsi">Deskripsi</label>
                    <div class="textarea-wrap">
                        <textarea name="description" id="textarea-description" maxlength="200" placeholder="Jelaskan detail kerusakan fasilitas dan lokasinya…"></textarea>
                        <span class="counter">0/200</span>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">
                     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                    Kirim Laporan
                </button>
            </form>
        </section>
    </main>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <script src="js/data.js"></script>
     <script src="js/app.js"></script>
</body>
</html>
